name: Build patched macOS app

on:
  push:
    branches:
      - codex-fix

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Check source
        run: git diff --check HEAD~1 HEAD
      - name: Run Swift tests
        run: swift test
      - name: Run core checks
        run: ./scripts/run-core-checks.sh
      - name: Package local app
        env:
          SWIFT_BUILD_ARCH: arm64
        run: |
          app_path=$(./scripts/package-local-app.sh | tail -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$app_path" patched-switcher.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: patched-switcher-macos-arm64
          path: patched-switcher.app.zip
          if-no-files-found: error
