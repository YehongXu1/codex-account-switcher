name: Build patched macOS app

on:
  push:
    branches:
      - codex-fix

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Check source
        run: git diff --check HEAD~1 HEAD
      - name: Run Swift tests
        run: swift test
      - name: Run core checks and build local handoff validation tool
        run: |
          ./scripts/run-core-checks.sh
          install_name_tool -id @rpath/libSwitcherCore.dylib .build/core-checks/libSwitcherCore.dylib
          swiftc -parse-as-library -I .build/core-checks -L .build/core-checks -lSwitcherCore -Xlinker -rpath -Xlinker @executable_path Checks/HerdrHandoffCheck.swift -o .build/core-checks/HerdrHandoffCheck
          swiftc -parse-as-library -I .build/core-checks -L .build/core-checks -lSwitcherCore -Xlinker -rpath -Xlinker @executable_path Sources/CodexAccountSwitcher/DesktopController.swift Checks/HerdrRoundtripCheck.swift -framework AppKit -o .build/core-checks/HerdrRoundtripCheck
          codesign --force --sign - .build/core-checks/libSwitcherCore.dylib .build/core-checks/HerdrHandoffCheck .build/core-checks/HerdrRoundtripCheck
          mkdir herdr-validation
          cp .build/core-checks/HerdrHandoffCheck .build/core-checks/libSwitcherCore.dylib herdr-validation/
          cp .build/core-checks/HerdrRoundtripCheck herdr-validation/
          ditto -c -k --keepParent herdr-validation herdr-validation.zip
      - name: Package local app
        env:
          SWIFT_BUILD_ARCH: arm64
        run: |
          app_path=$(./scripts/package-local-app.sh | tail -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$app_path" patched-switcher.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: patched-switcher-macos-arm64
          path: |
            patched-switcher.app.zip
            herdr-validation.zip
          if-no-files-found: error
